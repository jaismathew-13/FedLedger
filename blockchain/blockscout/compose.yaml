# Local adaptation of the official Blockscout Hardhat compose stack.
# Upstream source is pinned in upstream/ at the commit documented in README.md.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run start.ps1}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U blockscout -d blockscout]
      interval: 5s
      timeout: 5s
      retries: 30
  redis-db:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
  backend:
    image: ghcr.io/blockscout/blockscout:latest
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      db:
        condition: service_healthy
      redis-db:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - upstream/docker-compose/envs/common-blockscout.env
    environment:
      DATABASE_URL: postgresql://blockscout:${DB_PASSWORD}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Run start.ps1}
      ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545/
      ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:8545/
      ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:8545/
      ETHEREUM_JSONRPC_VARIANT: geth
      CHAIN_ID: '31337'
      FIRST_BLOCK: '0'
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: 'true'
      INDEXER_INTERNAL_TRANSACTIONS_TRACER_TYPE: opcode
      INDEXER_CATCHUP_BLOCKS_CONCURRENCY: '1'
      POOL_SIZE: '10'
      POOL_SIZE_API: '5'
      ECTO_USE_SSL: 'false'
      DISABLE_FILE_LOGGING: 'true'
      DISABLE_MARKET: 'true'
      API_V2_ENABLED: 'true'
      ACCOUNT_ENABLED: 'false'
      MICROSERVICE_SC_VERIFIER_ENABLED: 'false'
      MICROSERVICE_VISUALIZE_SOL2UML_ENABLED: 'false'
      MICROSERVICE_SIG_PROVIDER_ENABLED: 'false'
      MICROSERVICE_ACCOUNT_ABSTRACTION_ENABLED: 'false'
      BLOCKSCOUT_HOST: localhost
      BLOCKSCOUT_PROTOCOL: http
      COIN: ETH
      COIN_NAME: Ether
    command: >-
      sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'
    volumes:
      - backend-dets:/app/dets
  frontend:
    image: ghcr.io/blockscout/frontend:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_HOST: localhost
      NEXT_PUBLIC_API_PORT: '${EXPLORER_PORT}'
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_API_BASE_PATH: /
      NEXT_PUBLIC_APP_HOST: localhost
      NEXT_PUBLIC_APP_PORT: '${EXPLORER_PORT}'
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_NETWORK_NAME: Local Hospital Hardhat
      NEXT_PUBLIC_NETWORK_SHORT_NAME: Hospital FL
      NEXT_PUBLIC_NETWORK_ID: '31337'
      NEXT_PUBLIC_NETWORK_RPC_URL: http://127.0.0.1:8545/
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: Ether
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: ETH
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: '18'
      NEXT_PUBLIC_IS_TESTNET: 'true'
      NEXT_PUBLIC_HOMEPAGE_CHARTS: '[]'
      NEXT_PUBLIC_VISUALIZE_API_HOST: ''
      NEXT_PUBLIC_STATS_API_HOST: ''
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '127.0.0.1:${EXPLORER_PORT}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  database:
  redis:
  backend-dets:
